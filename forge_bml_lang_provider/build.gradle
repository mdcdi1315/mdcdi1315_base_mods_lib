// import java.nio.file.Files
// import java.nio.file.StandardCopyOption

plugins {
    id 'java-library'
}

def lib_actual_version = "1.0.0"

base {
    version = lib_actual_version
    archivesName = "bml_language_loader"
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(java_version)
}

jar {
    manifest.attributes([
            'FMLModType'            : "LANGPROVIDER",
            'Specification-Title'   : "BML_LANGUAGE_PROVIDER",
            'Specification-Vendor'  : "mdcdi1315",
            'Specification-Version' : lib_actual_version,
            'Implementation-Title'  : "BML_LANGUAGE_PROVIDER_FORGE_FML",
            'Implementation-Vendor' : "mdcdi1315",
            'Implementation-Version': "55"
    ])
}

apply from: rootProject.file('repositories.gradle')
apply from: 'dependencies.gradle'
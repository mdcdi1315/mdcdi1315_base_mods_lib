repositories {
    maven {
        url = "https://www.cursemaven.com"
        content {
            includeGroup 'curse.maven'
        }
    }

    exclusiveContent {
        forRepository {
            maven {
                name = 'Minecraft'
                url = 'https://libraries.minecraft.net/'
            }
        }
        filter {
            includeGroupAndSubgroups("org.lwjgl")
            includeGroupAndSubgroups("com.mojang")
        }
    }
}